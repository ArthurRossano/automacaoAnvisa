name: ANVISA Registry Expiration Check

on:
  schedule:
    # Executa toda segunda-feira à meia-noite UTC (21h de domingo no horário de Brasília)
    - cron: '0 0 * * 1'
  workflow_dispatch:
    # Permite execução manual direto no painel do repositório no GitHub

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers and dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run ANVISA automation script
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_NAME: ${{ secrets.SPREADSHEET_NAME }}
          SHEET_TAB_NAME: ${{ secrets.SHEET_TAB_NAME }}
        run: |
          python main.py
